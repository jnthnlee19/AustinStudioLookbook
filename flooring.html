<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin Studio Flooring Lookbook</title>
  <style>
    :root {
      --page-bg:#f5f3ee;
      --card:#ffffff;
      --text:#20252b;
      --muted:#6d737b;
      --line:#e1e4e7;
      --dark:#263341;
      --yellow:#f3c63f;
      --green:#3c8b64;
      --shadow:0 12px 34px rgba(34,42,50,.08);
      --shadow-hover:0 16px 38px rgba(34,42,50,.13);
      --radius:14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--page-bg);
      color:var(--text);
      font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,.97);
      border-bottom:1px solid var(--line);
      box-shadow:0 3px 18px rgba(30,36,43,.06);
    }

    .topbar-inner{
      width:min(1600px,calc(100% - 34px));
      margin:0 auto;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .logo-wrap{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .logo-wrap img{max-width:48px;max-height:48px;display:block}
    .brand-kicker{color:#91969c;text-transform:uppercase;font-size:.68rem;font-weight:800;letter-spacing:.12em;margin-bottom:2px}
    .brand-title{color:var(--dark);font-size:1.02rem;font-weight:750}

    .page{width:min(1600px,calc(100% - 34px));margin:0 auto;padding:26px 0 60px}

    .workspace-card{
      background:var(--card);
      border:1px solid var(--line);
      border-top:4px solid var(--yellow);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:20px;
    }

    .workspace-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
    .workspace-title h1{margin:0;color:var(--dark);font-size:1.55rem;font-weight:760;letter-spacing:-.02em}
    .workspace-title p{color:var(--muted);margin:6px 0 0;line-height:1.5;font-size:.91rem}

    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .search-wrap{flex:1 1 320px;min-width:230px;position:relative}
    .search-wrap input{width:100%;padding:10px 39px 10px 12px;border-radius:8px;border:1px solid #d4d7db;outline:none;background:#fff}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:#92979c;width:28px;height:28px;font-size:1rem;cursor:pointer}
    .btn{border:0;border-radius:8px;padding:10px 14px;font-size:.83rem;font-weight:720;cursor:pointer}
    .btn-light{background:#fff;color:var(--dark);border:1px solid #d7dade}
    .btn-light:hover{background:#f4f5f5}

    #lookbook-container{display:flex;flex-direction:column;gap:11px}
    details.category{border:1px solid var(--line);background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 3px 12px rgba(31,41,55,.035)}
    details.category>summary{list-style:none;padding:15px 18px;background:linear-gradient(to bottom,#fff,#f8f8f7);color:var(--dark);font-size:.98rem;font-weight:760;cursor:pointer;display:flex;align-items:center;gap:10px}
    details.category>summary::-webkit-details-marker{display:none}
    details.category>summary::before{content:"›";width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#7a8086;font-size:1.25rem;transition:transform .18s ease}
    details.category[open]>summary::before{transform:rotate(90deg)}
    details.category[open]>summary{border-bottom:1px solid var(--line)}
    .category-content{padding:14px}

    .option-container{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
    .option{min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid #dfe2e5;border-radius:11px;overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
    .option:hover{border-color:#c7cbd0;box-shadow:var(--shadow-hover);transform:translateY(-2px)}

    .option-image{position:relative;background:#f7f7f6;border-bottom:1px solid #ebecea;height:230px;min-height:230px;flex:0 0 230px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
    .option-image img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;display:block;cursor:zoom-in}
    .image-placeholder{height:100%;width:100%;display:flex;align-items:center;justify-content:center;color:#9ca1a6;font-size:.76rem;padding:20px;text-align:center}

    .option-body{display:flex;flex-direction:column;height:100%;padding:13px}
    .option-number{color:var(--dark);font-weight:800;font-size:.88rem;margin-bottom:4px}
    .option-description{font-size:.84rem;font-weight:650;line-height:1.35;color:#343a40;margin-bottom:7px}
    .option-sales{color:var(--muted);font-size:.76rem;font-style:italic;line-height:1.4;margin-bottom:13px}
    .option-spacer{flex:1}
    .price{color:var(--dark);font-size:.82rem;font-weight:800;padding-top:9px;border-top:1px solid #eceeed;line-height:1.35}
    .price.included{color:var(--green)}

    .no-results{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:35px;text-align:center;color:var(--muted)}

    .modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(15,18,22,.88);align-items:center;justify-content:center;padding:25px}
    .modal.open{display:flex}
    .modal-card{max-width:min(1100px,96vw);max-height:94vh;position:relative}
    .modal-card img{display:block;max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px;background:#fff}
    .modal-close{position:absolute;right:-14px;top:-14px;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:#fff;color:#24282c;font-weight:900;font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer}

    @media(max-width:1320px){.option-container{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:1040px){.option-container{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){.topbar{position:relative}.topbar-inner{padding:12px 0;flex-direction:column;align-items:flex-start}.workspace-top{flex-direction:column}.option-container{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:500px){.page,.topbar-inner{width:min(100% - 20px,1600px)}.workspace-card{padding:15px}.option-container{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo-wrap"><img src="/kb logo.png" alt="KB Home" /></div>
        <div>
          <div class="brand-kicker">Austin Design Studio</div>
          <div class="brand-title">Flooring Lookbook</div>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="workspace-card">
      <div class="workspace-top">
        <div class="workspace-title">
          <h1>Flooring Options</h1>
          <p>Browse current flooring choices. Pricing for non-included flooring is reviewed during your Virtual Selection Appointment.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search flooring options..." oninput="filterOptions()" />
          <button class="search-clear" onclick="clearSearch()" title="Clear search">×</button>
        </div>
        <button class="btn btn-light" onclick="toggleAllSections()">Expand / Collapse</button>
      </div>
    </section>

    <div id="lookbook-container"></div>
    <div class="no-results" id="no-results">No flooring options match your search.</div>
  </main>

  <div class="modal" id="image-modal" onclick="modalBackgroundClose(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeImageModal()">×</button>
      <img id="modal-image" alt="" />
    </div>
  </div>

  <script>
    const FLOORING_DATA = [
      {category:"Carpet",option:"2018056",description:"Belmont Court",sales:"",amount:"Included"},
      {category:"Carpet",option:"2023330",description:"Bernbrook PET Polyester",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2022575",description:"Palmer Court Endurance High Performance Fiber - Choice",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2021211",description:"Centrella Estate Endurance High Performance Fiber",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2021900",description:"Dundee Garden Endurance Enhanced HP Polyester",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2023331",description:"Watson Creek Endurance Enhanced High Performance PET",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2023332",description:"Lambert Mills Endurance Enhanced High Performance PET",sales:"",amount:""},
      {category:"Carpet",option:"2021901",description:"Winter Haven Endurance High Performance Fiber",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2023333",description:"Naples Bay Solution Dyed PET Polyester",sales:"",amount:"TBD"},
      {category:"Carpet",option:"2023334",description:"Lake Mabel PET Polyester",sales:"",amount:"TBD"},

      {category:"Tile",option:"2022333",description:"Stella Vista - Included Choice",sales:"Included in Wet Areas (Entry, Kitchen, Laundry, and Baths)",amount:"Included"},
      {category:"Tile",option:"2018961",description:"Memoir",sales:"Available in: 12X12 Only",amount:"TBD"},
      {category:"Tile",option:"2019053",description:"Florentine",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2020754",description:"C.F. Choice",sales:"Available in: 18X18, 12X24",amount:"TBD"},
      {category:"Tile",option:"2021223",description:"C.F. Prime Balans",sales:"Available in: 18X18, 12X24",amount:"TBD"},
      {category:"Tile",option:"2022326",description:"Coastline",sales:"Available in: 12X12, 18X18, 12X24",amount:"TBD"},
      {category:"Tile",option:"2022327",description:"Costar",sales:"Calacatta Sky 12X24 Only",amount:"TBD"},
      {category:"Tile",option:"2020136",description:"Marble Obsession Matte or Polished",sales:"Available in: 12X24",amount:"TBD"},
      {category:"Tile",option:"2020603",description:"Vertuo",sales:"Available in: 12X24",amount:"TBD"},
      {category:"Tile",option:"2020605",description:"Perpetuo Matte or Polished",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2021242",description:"Rekindle",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2022334",description:"Alterations",sales:"Available in: 12X24",amount:"TBD"},
      {category:"Tile",option:"2022335",description:"Articulo Matte or Polished",sales:"Available in: 12X24",amount:"TBD"},
      {category:"Tile",option:"2022337",description:"Artsy Matte or Polished",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2022343",description:"Forgehaus",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2022345",description:"Portfolio",sales:"Available in: 12X24, 24X24",amount:"TBD"},
      {category:"Tile",option:"2022328",description:"CF Prime NS",sales:"Available in: 12X24, 18X18",amount:"TBD"},
      {category:"Tile",option:"2022332",description:"Stella Vista",sales:"Available in: 18X18, 12X24",amount:"TBD"},

      {category:"Design Tile",option:"2020606",description:"Moroccan Concrete 8\" Hexagon Glazed Porcelain",sales:"",amount:"TBD"},
      {category:"Design Tile",option:"2020607",description:"Perpetuo 8x8 Hexagon Colorbody Porcelain",sales:"",amount:"TBD"},
      {category:"Design Tile",option:"2020135",description:"Marble Obsession 8x8 Hexagon Glazed Porcelain",sales:"",amount:"TBD"},

      {category:"Wood-Look Tile",option:"2020081",description:"Vicinity 6x36 Glazed Porcelain",sales:"",amount:"TBD"},
      {category:"Wood-Look Tile",option:"2020083",description:"Edgewood 6x24 Glazed Porcelain",sales:"",amount:"TBD"},

      {category:"Engineered Wood",option:"2021218",description:"Aegean Oak 5\" x 38\" Random Length",sales:"",amount:"TBD"},
      {category:"Engineered Wood",option:"2022577",description:"Archer Landing 6.38\" x 3/8\" Random Length",sales:"",amount:"TBD"},
      {category:"Engineered Wood",option:"2023340",description:"Haven Bay White Oak 7 1/2\" x 1/2\" Random Length",sales:"",amount:"TBD"},
      {category:"Engineered Wood",option:"2018201",description:"Heritage Square Pecan 7 1/2\" x 1/2\" Random Length",sales:"",amount:"TBD"},

      {category:"Luxury Vinyl Plank",option:"2018593",description:"Layton Lake 7\" x 48\" x 5mm - Choice",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2018417",description:"Bandera 7\" x 48\" x 7mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021903",description:"Del Oro Point 7\" x 60\" x 6.5mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021904",description:"Heartland Ranch 9\" x 60\" x 7mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2023338",description:"Barbary Coast COREtec 9\" x ML x 8mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2022625",description:"Bellina Falls 9\" x 60\" x 6.5mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021905",description:"Mystic Estates 9\"x 60\" x 8mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021906",description:"Tortosa Ridge 9\" x 72\" x 6.5mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2018422",description:"Bryan Crossing COREtec 9\" x 72\" x 5.2mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021222",description:"Rio Duvall 9\" x 72\" x 8mm",sales:"",amount:"TBD"},
      {category:"Luxury Vinyl Plank",option:"2021000",description:"Emerald Hollow 9\" x 72\" x 10mm",sales:"",amount:"TBD"}
    ];

    function pricingLabel(item){
      const text = [item.amount,item.description,item.sales].filter(Boolean).join(" ");
      return /\bincluded\b/i.test(text)
        ? "Included"
        : "Pricing Available at Virtual Selection Appointment";
    }

    function renderFlooring(){
      const grouped = {};
      FLOORING_DATA.forEach(item => {
        if(!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      const container = document.getElementById("lookbook-container");
      container.innerHTML = "";

      Object.entries(grouped).forEach(([category,items]) => {
        const details = document.createElement("details");
        details.className = "category";
        details.open = true;
        details.dataset.search = category.toLowerCase();

        const summary = document.createElement("summary");
        summary.textContent = category;
        details.appendChild(summary);

        const content = document.createElement("div");
        content.className = "category-content";

        const grid = document.createElement("div");
        grid.className = "option-container";

        items.forEach(item => grid.appendChild(createOptionCard(item)));
        content.appendChild(grid);
        details.appendChild(content);
        container.appendChild(details);
      });
    }

    function createOptionCard(item){
      const card = document.createElement("div");
      card.className = "option";
      card.dataset.search = [item.option,item.description,item.sales,item.category].join(" ").toLowerCase();

      const imageArea = document.createElement("div");
      imageArea.className = "option-image";
      const image = new Image();
      image.src = `/images/${encodeURIComponent(item.option)}.jpg`;
      image.alt = item.option;
      image.onload = () => {
        imageArea.innerHTML = "";
        imageArea.appendChild(image);
      };
      image.onerror = () => {
        imageArea.innerHTML = `<div class="image-placeholder">No image available<br>${escapeHTML(item.option)}</div>`;
      };
      image.onclick = () => openImageModal(image.src,item.option);
      imageArea.appendChild(image);
      card.appendChild(imageArea);

      const body = document.createElement("div");
      body.className = "option-body";

      const number = document.createElement("div");
      number.className = "option-number";
      number.textContent = item.option;

      const desc = document.createElement("div");
      desc.className = "option-description";
      desc.textContent = item.description;

      body.appendChild(number);
      body.appendChild(desc);

      if(item.sales){
        const sales = document.createElement("div");
        sales.className = "option-sales";
        sales.textContent = item.sales;
        body.appendChild(sales);
      }

      const spacer = document.createElement("div");
      spacer.className = "option-spacer";
      body.appendChild(spacer);

      const price = document.createElement("div");
      price.className = "price";
      const label = pricingLabel(item);
      if(label === "Included") price.classList.add("included");
      price.textContent = label;
      body.appendChild(price);

      card.appendChild(body);
      return card;
    }

    function filterOptions(){
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      let visible = 0;

      document.querySelectorAll("details.category").forEach(section => {
        let sectionVisible = 0;
        section.querySelectorAll(".option").forEach(card => {
          const match = !query || card.dataset.search.includes(query);
          card.style.display = match ? "" : "none";
          if(match){visible++;sectionVisible++;}
        });
        section.style.display = sectionVisible ? "" : "none";
        if(query && sectionVisible) section.open = true;
      });

      document.getElementById("no-results").style.display = visible ? "none" : "block";
    }

    function clearSearch(){
      const input = document.getElementById("search-input");
      input.value = "";
      filterOptions();
      input.focus();
    }

    function toggleAllSections(){
      const sections = Array.from(document.querySelectorAll("details.category")).filter(el => el.style.display !== "none");
      const shouldOpen = sections.some(el => !el.open);
      sections.forEach(el => el.open = shouldOpen);
    }

    function openImageModal(src,alt){
      const modal = document.getElementById("image-modal");
      const image = document.getElementById("modal-image");
      image.src = src;
      image.alt = alt || "Flooring option";
      modal.classList.add("open");
    }

    function closeImageModal(){
      document.getElementById("image-modal").classList.remove("open");
    }

    function modalBackgroundClose(event){
      if(event.target.id === "image-modal") closeImageModal();
    }

    function escapeHTML(value){
      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    document.addEventListener("keydown",event => {
      if(event.key === "Escape") closeImageModal();
    });

    renderFlooring();
  </script>
</body>
</html>
