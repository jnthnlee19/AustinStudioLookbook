<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Austin Studio Lookbook</title>

  <!-- SheetJS - reads the uploaded Excel workbook -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

  <style>

    /* =========================================================
       AUSTIN STUDIO LOOKBOOK
       MAIN COLORS / EASY BRAND EDITS
       ========================================================= */

    :root {
      --page-bg: #f5f3ee;
      --card: #ffffff;
      --text: #20252b;
      --muted: #6d737b;
      --soft-muted: #91969c;
      --line: #e1e4e7;

      --dark: #263341;
      --dark-hover: #1d2833;

      --yellow: #f3c63f;
      --yellow-soft: #fff8dd;

      --green: #3c8b64;
      --green-soft: #edf8f2;

      --red: #c7483d;

      --shadow:
        0 12px 34px rgba(34, 42, 50, 0.08);

      --shadow-hover:
        0 16px 38px rgba(34, 42, 50, 0.13);

      --radius: 14px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        "Segoe UI",
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
    }


    button,
    input,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =========================================================
       STICKY TOP HEADER
       ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 500;

      background: rgba(255,255,255,0.97);
      border-bottom: 1px solid var(--line);

      box-shadow:
        0 3px 18px rgba(30, 36, 43, 0.06);
    }


    .topbar-inner {
      width: min(1600px, calc(100% - 34px));
      margin: 0 auto;

      min-height: 72px;

      display: grid;
      grid-template-columns:
        minmax(220px, 1fr)
        minmax(300px, 2fr)
        minmax(250px, 1fr);

      gap: 20px;
      align-items: center;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }


    .logo-wrap {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 auto;
    }


    .logo-wrap img {
      max-width: 48px;
      max-height: 48px;
      display: block;
    }


    .brand-copy {
      min-width: 0;
    }


    .brand-kicker {
      color: var(--soft-muted);

      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;

      margin-bottom: 2px;
    }


    .brand-title {
      color: var(--dark);
      font-size: 1.02rem;
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================================================
       HOUSE INFORMATION
       ========================================================= */

    .house-info {
      text-align: center;
      min-width: 0;

      color: #444b52;
      font-size: 0.85rem;
      line-height: 1.4;
    }


    .house-info div:first-child {
      font-weight: 700;
      color: var(--dark);
    }


    /* =========================================================
       TOTAL
       ========================================================= */

    .topbar-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }


    .total-box {
      text-align: right;
    }


    .total-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }


    #total-bar {
      color: var(--dark);
      font-size: 1.23rem;
      font-weight: 800;
      white-space: nowrap;
    }


    /* =========================================================
       PAGE WRAPPER
       ========================================================= */

    .page {
      width: min(1600px, calc(100% - 34px));
      margin: 0 auto;
      padding: 26px 0 60px;
    }


    /* =========================================================
       INTRO / TOOLBAR CARD
       ========================================================= */

    .workspace-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 4px solid var(--yellow);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      padding: 22px;

      margin-bottom: 20px;
    }


    .workspace-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 18px;
    }


    .workspace-title h1 {
      margin: 0;

      color: var(--dark);

      font-size: 1.55rem;
      font-weight: 760;
      letter-spacing: -0.02em;
    }


    .workspace-title p {
      color: var(--muted);

      margin: 6px 0 0;

      line-height: 1.5;
      font-size: 0.91rem;
    }


    .back-link {
      border: 1px solid var(--line);
      background: #fff;

      color: var(--dark);

      text-decoration: none;

      padding: 9px 13px;

      border-radius: 9px;

      font-size: 0.84rem;
      font-weight: 700;

      white-space: nowrap;
    }


    .back-link:hover {
      background: #f7f7f7;
    }


    /* =========================================================
       CUSTOMER LOOKBOOK NAME
       ========================================================= */

    .create-row {
      background: #f9faf9;

      border: 1px solid var(--line);
      border-radius: 11px;

      padding: 14px;

      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;

      align-items: end;
      gap: 12px;

      margin-bottom: 15px;
    }


    .field label {
      display: block;

      margin-bottom: 6px;

      color: #4d555e;

      font-size: 0.76rem;
      font-weight: 750;

      text-transform: uppercase;
      letter-spacing: 0.055em;
    }


    .field input {
      width: 100%;

      padding: 11px 12px;

      border-radius: 8px;
      border: 1px solid #ced3d8;

      background: #fff;

      color: var(--text);

      outline: none;
    }


    .field input:focus {
      border-color: #a9afb6;

      box-shadow:
        0 0 0 3px rgba(38, 51, 65, 0.06);
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .btn {
      border: 0;
      border-radius: 8px;

      padding: 10px 14px;

      font-size: 0.83rem;
      font-weight: 720;

      transition:
        background 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }


    .btn:hover {
      transform: translateY(-1px);
    }


    .btn-primary {
      background: var(--dark);
      color: #fff;
    }


    .btn-primary:hover {
      background: var(--dark-hover);
    }


    .btn-yellow {
      background: var(--yellow);
      color: #272727;

      box-shadow:
        0 4px 11px rgba(243, 198, 63, 0.18);
    }


    .btn-yellow:hover {
      background: #eabd31;
    }


    .btn-light {
      background: #fff;
      color: var(--dark);

      border: 1px solid #d7dade;
    }


    .btn-light:hover {
      background: #f4f5f5;
    }


    /* =========================================================
       TOOLBAR
       ========================================================= */

    .toolbar {
      display: flex;
      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }


    .toolbar-divider {
      width: 1px;
      height: 27px;

      background: var(--line);

      margin: 0 3px;
    }


    .search-wrap {
      flex: 1 1 290px;
      min-width: 230px;

      position: relative;
    }


    .search-wrap input {
      width: 100%;

      padding: 10px 39px 10px 12px;

      border-radius: 8px;
      border: 1px solid #d4d7db;

      outline: none;

      background: #fff;
    }


    .search-wrap input:focus {
      border-color: #adb3ba;
      box-shadow:
        0 0 0 3px rgba(38,51,65,0.05);
    }


    .search-clear {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #92979c;

      width: 28px;
      height: 28px;

      font-size: 1rem;
    }


    .select-all-wrap {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 10px;

      border: 1px solid #d7dade;
      border-radius: 8px;

      background: #fff;

      font-size: 0.82rem;
      color: #4c535a;
    }


    .select-all-wrap input {
      accent-color: var(--dark);
    }


    /* =========================================================
       CATEGORY SECTIONS
       ========================================================= */

    #lookbook-container {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }


    .loading-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      padding: 35px;

      text-align: center;

      color: var(--muted);
    }


    details.category,
    details.subcategory {
      background: transparent;
    }


    details.category {
      border: 1px solid var(--line);

      background: #fff;

      border-radius: 11px;

      overflow: hidden;

      box-shadow:
        0 3px 12px rgba(31, 41, 55, 0.035);
    }


    details.category > summary {
      list-style: none;

      padding: 15px 18px;

      background:
        linear-gradient(
          to bottom,
          #ffffff,
          #f8f8f7
        );

      color: var(--dark);

      font-size: 0.98rem;
      font-weight: 760;

      cursor: pointer;

      display: flex;
      align-items: center;

      gap: 10px;
    }


    details.category > summary::-webkit-details-marker,
    details.subcategory > summary::-webkit-details-marker {
      display: none;
    }


    details.category > summary::before {
      content: "›";

      width: 22px;
      height: 22px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: #7a8086;

      font-size: 1.25rem;

      transform: rotate(0deg);

      transition: transform 0.18s ease;
    }


    details.category[open] > summary::before {
      transform: rotate(90deg);
    }


    details.category[open] > summary {
      border-bottom: 1px solid var(--line);
    }


    .category-content {
      padding: 9px;
    }


    details.subcategory {
      margin: 8px;
    }


    details.subcategory > summary {
      list-style: none;

      padding: 11px 14px;

      background: #f2f2f0;

      border: 1px solid #e2e3e1;

      color: #4b535a;

      font-size: 0.88rem;
      font-weight: 720;

      border-radius: 8px;

      cursor: pointer;

      display: flex;
      align-items: center;

      gap: 8px;
    }


    details.subcategory > summary::before {
      content: "+";

      width: 18px;

      color: #858b91;

      font-weight: 800;
    }


    details.subcategory[open] > summary::before {
      content: "–";
    }


    /* =========================================================
       OPTION GRID
       ========================================================= */

    .option-container {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 13px;

      padding: 14px 0 7px;
    }


    /* =========================================================
       OPTION CARDS
       ========================================================= */

    .option {
      min-width: 0;

      display: flex;
      flex-direction: column;

      background: #fff;

      border: 1px solid #dfe2e5;

      border-radius: 11px;

      overflow: hidden;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;

      position: relative;
    }


    .option:hover {
      border-color: #c7cbd0;

      box-shadow: var(--shadow-hover);

      transform: translateY(-2px);
    }


    .option.selected {
      border: 2px solid var(--yellow);

      box-shadow:
        0 9px 24px rgba(192, 151, 29, 0.11);
    }


    .option.selected::after {
      content: "SELECTED";

      position: absolute;
      right: 9px;
      top: 9px;

      z-index: 5;

      background: var(--yellow);

      color: #282828;

      font-size: 0.62rem;
      font-weight: 850;

      letter-spacing: 0.05em;

      padding: 5px 7px;

      border-radius: 6px;

      pointer-events: none;
    }


    /* =========================================================
       OPTION IMAGE
       ========================================================= */

    .option-image {
      position: relative;

      background: #f7f7f6;

      border-bottom: 1px solid #ebecea;

      height: 230px;
      min-height: 230px;
      flex: 0 0 230px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding: 8px;
    }


    .option-image img {
      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      cursor: zoom-in;

      padding: 0;
    }



    /* =========================================================
       MULTIPLE IMAGE GALLERY
       Naming:
       1234567.jpg   = main image
       1234567-2.jpg = second image
       1234567-3.jpg = third image
       ========================================================= */

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;

      width: 34px;
      height: 34px;

      display: none;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.85);
      border-radius: 50%;

      background: rgba(38,51,65,.78);
      color: #fff;

      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;

      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      cursor: pointer;
    }

    .gallery-arrow:hover {
      background: rgba(38,51,65,.94);
    }

    .gallery-arrow.prev {
      left: 10px;
    }

    .gallery-arrow.next {
      right: 10px;
    }

    .option-image.has-gallery .gallery-arrow {
      display: flex;
    }

    .gallery-count {
      position: absolute;
      right: 9px;
      bottom: 9px;
      z-index: 4;

      display: none;

      padding: 4px 7px;
      border-radius: 999px;

      background: rgba(38,51,65,.78);
      color: #fff;

      font-size: .68rem;
      font-weight: 750;
      letter-spacing: .02em;

      pointer-events: none;
    }

    .option-image.has-gallery .gallery-count {
      display: block;
    }


    .image-placeholder {
      height: 100%;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #9ca1a6;

      font-size: 0.76rem;

      padding: 20px;

      text-align: center;
    }


    /* =========================================================
       OPTION BODY
       ========================================================= */

    .option-body {
      display: flex;
      flex-direction: column;

      height: 100%;

      padding: 13px;
    }


    .option-number {
      color: var(--dark);

      font-weight: 800;
      font-size: 0.88rem;

      margin-bottom: 4px;
    }


    .option-description {
      font-size: 0.84rem;
      font-weight: 650;

      line-height: 1.35;

      color: #343a40;

      margin-bottom: 7px;
    }


    .option-sales {
      color: var(--muted);

      font-size: 0.76rem;
      font-style: italic;

      line-height: 1.4;

      margin-bottom: 13px;
    }


    .option-spacer {
      flex: 1;
    }


    .price {
      color: var(--dark);

      font-size: 0.88rem;
      font-weight: 800;

      padding-top: 9px;

      border-top: 1px solid #eceeed;

      margin-bottom: 10px;
    }


    /* =========================================================
       SELECT / QUANTITY
       ========================================================= */

    .option-controls {
      display: grid;

      grid-template-columns: 1fr auto;

      align-items: center;

      gap: 9px;

      margin-bottom: 10px;
    }


    .check-label {
      display: flex;
      align-items: center;

      gap: 7px;

      color: #434a50;

      font-size: 0.78rem;
      font-weight: 700;

      cursor: pointer;
    }


    .option-checkbox {
      width: 17px;
      height: 17px;

      accent-color: var(--dark);

      cursor: pointer;
    }


    .qty-wrap {
      display: flex;
      align-items: center;

      gap: 5px;

      color: var(--muted);

      font-size: 0.72rem;
    }


    .option-qty {
      width: 51px;

      padding: 6px;

      border: 1px solid #d5d9dc;

      border-radius: 6px;

      text-align: center;

      background: #fff;
    }



    /* =========================================================
       OPTION VARIATION DROPDOWNS
       ========================================================= */

    .option-variations {
      display: grid;
      gap: 8px;
      margin: 0 0 10px;
      padding: 10px;
      border: 1px solid #e2e4e6;
      border-radius: 8px;
      background: #fafaf9;
    }

    .variation-field { display: grid; gap: 4px; }

    .variation-field label {
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .variation-select {
      width: 100%;
      min-width: 0;
      padding: 8px 30px 8px 9px;
      border: 1px solid #d2d6da;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font-size: 0.76rem;
      outline: none;
    }

    .variation-select:focus {
      border-color: #a9afb6;
      box-shadow: 0 0 0 3px rgba(38,51,65,0.06);
    }

    .variation-select:disabled {
      background: #f0f1f1;
      color: #92979c;
      cursor: not-allowed;
    }

    /* =========================================================
       COMMENTS
       ========================================================= */

    .comment-label {
      display: block;

      color: var(--muted);

      font-size: 0.7rem;
      font-weight: 700;

      margin-bottom: 4px;
    }


    .option-comment {
      width: 100%;

      min-height: 54px;
      resize: vertical;

      border: 1px solid #d8dbde;
      border-radius: 7px;

      padding: 7px 8px;

      font-size: 0.76rem;

      outline: none;
    }


    .option-comment:focus {
      border-color: #aeb4bb;

      box-shadow:
        0 0 0 3px rgba(38,51,65,0.05);
    }


    /* =========================================================
       IMAGE MODAL
       ========================================================= */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 2000;

      background: rgba(15, 18, 22, 0.88);

      align-items: center;
      justify-content: center;

      padding: 25px;
    }


    .modal.open {
      display: flex;
    }


    .modal-card {
      max-width: min(1100px, 96vw);
      max-height: 94vh;

      position: relative;
    }


    .modal-card img {
      display: block;

      max-width: 100%;
      max-height: 88vh;

      object-fit: contain;

      border-radius: 8px;

      background: #fff;
    }



    .modal-gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;

      width: 44px;
      height: 44px;

      display: none;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.5);
      border-radius: 50%;

      background: rgba(255,255,255,.92);
      color: #263341;

      font-size: 1.35rem;
      font-weight: 850;
      line-height: 1;

      box-shadow: 0 5px 18px rgba(0,0,0,.22);
    }

    .modal-gallery-arrow.prev {
      left: -58px;
    }

    .modal-gallery-arrow.next {
      right: -58px;
    }

    .modal-card.has-gallery .modal-gallery-arrow {
      display: flex;
    }

    .modal-gallery-count {
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);

      display: none;

      padding: 5px 9px;
      border-radius: 999px;

      background: rgba(255,255,255,.92);
      color: #263341;

      font-size: .75rem;
      font-weight: 800;
    }

    .modal-card.has-gallery .modal-gallery-count {
      display: block;
    }

    @media (max-width: 760px) {
      .modal-gallery-arrow.prev {
        left: 8px;
      }

      .modal-gallery-arrow.next {
        right: 8px;
      }

      .modal-gallery-arrow {
        width: 40px;
        height: 40px;
      }
    }


    .modal-close {
      position: absolute;

      right: -14px;
      top: -14px;

      width: 36px;
      height: 36px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.45);

      background: #fff;

      color: #24282c;

      font-weight: 900;
      font-size: 1.2rem;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================================================
       NO RESULTS
       ========================================================= */

    .no-results {
      display: none;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: 12px;

      padding: 35px;

      text-align: center;

      color: var(--muted);
    }


    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 28px;

      transform:
        translate(-50%, 20px);

      opacity: 0;
      pointer-events: none;

      background: #273542;
      color: #fff;

      padding: 10px 15px;

      border-radius: 8px;

      font-size: 0.83rem;
      font-weight: 650;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

      z-index: 3000;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }


    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }



    /* =========================================================
       CUSTOMER AUTOSAVE STATUS
       ========================================================= */

    .autosave-status {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;

      margin-top: 5px;

      color: var(--muted);

      font-size: 0.72rem;
      font-weight: 700;

      white-space: nowrap;
    }


    body.customer-mode .autosave-status {
      display: flex;
    }


    .autosave-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #aeb4bb;

      flex: 0 0 auto;
    }


    .autosave-status.saving {
      color: #806713;
    }


    .autosave-status.saving .autosave-dot {
      background: var(--yellow);

      box-shadow:
        0 0 0 3px rgba(243,198,63,.16);
    }


    .autosave-status.saved {
      color: var(--green);
    }


    .autosave-status.saved .autosave-dot {
      background: var(--green);

      box-shadow:
        0 0 0 3px rgba(60,139,100,.12);
    }

  <script>

    /* =========================================================
       AUSTIN STUDIO LOOKBOOK
       MAIN JAVASCRIPT
       ========================================================= */



    /* =========================================================
       FORMAT PRICE
       ========================================================= */

    function parsePrice(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return 0;
      }

      const cleaned =
        String(value)
          .replace(/[$,\s]/g, "");

      const number =
        parseFloat(cleaned);

      return Number.isFinite(number)
        ? number
        : 0;

    }


    function formatPrice(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "TBD";
      }

      if (
        /\bincluded\b/i.test(
          String(value)
        )
      ) {
        return "Included";
      }

      const number =
        parsePrice(value);

      return number.toLocaleString(
        undefined,
        {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );

    }



    /* =========================================================
       READ EXCEL WORKBOOK
       ========================================================= */

    /* =========================================================
       CUSTOMER LOOKBOOK LOADER
       ========================================================= */

    let activeCustomerLookbook = null;

    let autosaveTimer = null;
    let autosaveInFlight = false;
    let autosaveQueued = false;


    function setAutosaveStatus(
      state,
      message
    ) {

      const box =
        document.getElementById(
          "autosave-status"
        );

      const text =
        document.getElementById(
          "autosave-status-text"
        );


      if (!box || !text) {
        return;
      }


      box.classList.remove(
        "saving",
        "saved",
        "error"
      );


      if (state) {
        box.classList.add(state);
      }


      text.textContent =
        message ||
        "✓ All changes saved";

    }


    function scheduleAutosave() {

      if (
        !document.body.classList.contains(
          "customer-mode"
        ) ||
        !activeCustomerLookbook?.id
      ) {
        return;
      }


      clearTimeout(
        autosaveTimer
      );


      setAutosaveStatus(
        "saving",
        "Saving..."
      );


      autosaveTimer =
        setTimeout(
          saveCustomerSelections,
          900
        );

    }


    async function saveCustomerSelections() {

      if (!activeCustomerLookbook?.id) {
        return;
      }


      if (autosaveInFlight) {

        autosaveQueued = true;

        return;

      }


      autosaveInFlight = true;


      try {

        const response =
          await fetch(
            "/.netlify/functions/save-selections",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  id:
                    activeCustomerLookbook.id,

                  selections:
                    getCurrentSelections()
                })
            }
          );


        const result =
          await response.json();


        if (
          response.status === 403 &&
          result.code === "LOOKBOOK_DISABLED"
        ) {

          showDisabledLookbook();

          return;

        }


        if (!response.ok) {

          throw new Error(
            result.error ||
            result.message ||
            "Unable to save selections."
          );

        }


        activeCustomerLookbook.updatedAt =
          result.updatedAt ||
          new Date().toISOString();


        const savedTime =
          new Date(
            activeCustomerLookbook.updatedAt
          );


        setAutosaveStatus(
          "saved",
          `✓ Saved at ${savedTime.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
          })}`
        );


      } catch (error) {

        console.error(
          "AUTOSAVE ERROR:",
          error
        );


        setAutosaveStatus(
          "error",
          "⚠ Changes not saved"
        );


      } finally {

        autosaveInFlight = false;


        if (autosaveQueued) {

          autosaveQueued = false;

          scheduleAutosave();

        }

      }

    }


    function enableCustomerAutosave() {

      document
        .getElementById(
          "lookbook-container"
        )
        ?.addEventListener(
          "change",
          event => {

            if (
              event.target.matches(
                ".option-checkbox, .option-qty, .option-comment"
              )
            ) {

              scheduleAutosave();

            }

          }
        );


      document
        .getElementById(
          "lookbook-container"
        )
        ?.addEventListener(
          "input",
          event => {

            if (
              event.target.matches(
                ".option-qty, .option-comment"
              )
            ) {

              scheduleAutosave();

            }

          }
        );

    }




    async function loadCustomerLookbook() {

      document.body.classList.add(
        "customer-mode"
      );


      const params =
        new URLSearchParams(
          window.location.search
        );


      const id =
        params.get("id");


      if (!id) {

        showCustomerLoadError(
          "This Lookbook link is missing its customer ID."
        );

        return;

      }


      try {

        const response =
          await fetch(
            `/.netlify/functions/get-lookbook?id=${encodeURIComponent(id)}`,
            {
              headers: {
                "Accept": "application/json"
              },
              cache: "no-store"
            }
          );


        const result =
          await response.json();


        if (
          response.status === 403 &&
          result.code === "LOOKBOOK_DISABLED"
        ) {

          showDisabledLookbook();

          return;

        }


        if (!response.ok) {

          throw new Error(
            result.error ||
            result.message ||
            "This Lookbook could not be loaded."
          );

        }


        activeCustomerLookbook =
          result.lookbook || result;


        const workbookBase64 =
          activeCustomerLookbook.workbook;


        if (
          !workbookBase64 ||
          typeof workbookBase64 !== "string"
        ) {

          throw new Error(
            "The saved Lookbook does not contain workbook data."
          );

        }


        const customerName =
          document.getElementById(
            "customer-lookbook-name"
          );


        if (customerName) {

          customerName.textContent =
            activeCustomerLookbook.name || "";

        }


        if (activeCustomerLookbook.name) {

          document.title =
            `${activeCustomerLookbook.name} | Austin Studio Lookbook`;

        }


        const workbook =
          XLSX.read(
            workbookBase64,
            {
              type: "base64"
            }
          );


        const sheetObject =
          workbook.Sheets["Sheet2"];


        if (!sheetObject) {

          throw new Error(
            'The workbook does not contain a sheet named "Sheet2".'
          );

        }


        const sheet =
          XLSX.utils.sheet_to_json(
            sheetObject,
            {
              header: 1
            }
          );


        loadHouseInfo(sheet);

        buildLookbook(sheet);

        restoreSavedSelections(
          activeCustomerLookbook.selections || []
        );


        setAutosaveStatus(
          "saved",
          activeCustomerLookbook.updatedAt
            ? `✓ Saved at ${new Date(activeCustomerLookbook.updatedAt).toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit"
              })}`
            : "✓ All changes saved"
        );


      } catch (error) {

        console.error(
          "CUSTOMER LOOKBOOK LOAD ERROR:",
          error
        );


        showCustomerLoadError(
          error.message ||
          "This Lookbook could not be loaded."
        );

      }

    }


    function restoreSavedSelections(
      selections
    ) {

      if (!Array.isArray(selections)) {
        return;
      }


      selections.forEach(
        saved => {

          const optionNumber =
            String(
              saved?.option ?? ""
            );


          const card =
            Array.from(
              document.querySelectorAll(
                ".option"
              )
            )
            .find(
              item =>
                item.dataset.option ===
                optionNumber
            );


          if (!card) {
            return;
          }


          const checkbox =
            card.querySelector(
              ".option-checkbox"
            );


          const qty =
            card.querySelector(
              ".option-qty"
            );


          const comment =
            card.querySelector(
              ".option-comment"
            );


          if (checkbox) {

            checkbox.checked = true;

          }


          if (qty) {

            qty.value =
              Math.max(
                1,
                parseInt(
                  saved?.qty || 1
                )
              );

          }


          if (comment) {

            comment.value =
              saved?.comment || "";

          }


          const primaryVariation =
            card.querySelector(
              ".variation-primary"
            );

          const secondaryVariation =
            card.querySelector(
              ".variation-secondary"
            );

          if (primaryVariation && saved?.variation1) {
            primaryVariation.value = saved.variation1;
            primaryVariation.dispatchEvent(
              new Event("change")
            );
          }

          if (secondaryVariation && saved?.variation2) {
            secondaryVariation.value = saved.variation2;
          }


          card.classList.add(
            "selected"
          );

        }
      );


      updateTotal();

      updateMasterCheckbox();

    }


    function showDisabledLookbook() {

      activeCustomerLookbook = null;

      const container =
        document.getElementById(
          "lookbook-container"
        );


      if (!container) {
        return;
      }


      const noResults =
        document.getElementById(
          "no-results"
        );


      if (noResults) {
        noResults.style.display = "none";
      }


      container.innerHTML = `

        <div class="disabled-lookbook-card">

          <div class="disabled-lookbook-icon">
            ×
          </div>

          <h2>
            This Lookbook is no longer active.
          </h2>

          <p>
            This Lookbook link has been disabled by the Austin Design Studio.
            Your saved selections have not been deleted.
            Please contact your Austin Design Studio representative if you need assistance.
          </p>

        </div>

      `;


      setAutosaveStatus(
        "",
        ""
      );

    }



    function showCustomerLoadError(
      message
    ) {

      const container =
        document.getElementById(
          "lookbook-container"
        );


      if (!container) {
        return;
      }


      container.innerHTML = `

        <div class="loading-card">

          <strong>
            This Lookbook could not be loaded.
          </strong>

          <div style="
            margin-top:8px;
            line-height:1.5;
          ">
            ${escapeHTML(message)}
          </div>

        </div>

      `;

    }



    function loadWorkbook() {

      const base64 =
        localStorage.getItem("workbook");


      if (!base64) {

        document
          .getElementById("lookbook-container")
          .innerHTML = `

            <div class="loading-card">

              <strong>
                No workbook was found.
              </strong>

              <div style="
                margin-top:8px;
                margin-bottom:18px;
              ">
                Return to the Lookbook Dashboard
                and upload an Excel file first.
              </div>

              <a
                href="/"
                class="back-link"
              >
                Return to Dashboard
              </a>

            </div>

          `;

        return;

      }


      try {

        const workbook =
          XLSX.read(
            base64,
            {
              type: "base64"
            }
          );


        const sheetObject =
          workbook.Sheets["Sheet2"];


        if (!sheetObject) {

          throw new Error(
            'The workbook does not contain a sheet named "Sheet2".'
          );

        }


        const sheet =
          XLSX.utils.sheet_to_json(
            sheetObject,
            {
              header: 1
            }
          );


        loadHouseInfo(sheet);

        buildLookbook(sheet);


      } catch (error) {

        console.error(error);

        document
          .getElementById("lookbook-container")
          .innerHTML = `

            <div class="loading-card">

              <strong>
                This workbook could not be loaded.
              </strong>

              <div style="margin-top:8px;">
                ${escapeHTML(error.message)}
              </div>

            </div>

          `;

      }

    }



    /* =========================================================
       HOUSE INFORMATION

       Existing workbook structure:
       Row 12 / array row 11
       ========================================================= */

    function loadHouseInfo(sheet) {

      const houseInfoText =
        sheet[11]?.[0] || "";


      const parts =
        String(houseInfoText)
          .split("  ")
          .map(item => item.trim())
          .filter(Boolean);


      const houseInfo =
        document.getElementById(
          "house-info"
        );


      houseInfo.innerHTML =
        parts
          .map(
            item =>
              `<div>${escapeHTML(item)}</div>`
          )
          .join("");

    }



    /* =========================================================
       BUILD LOOKBOOK DATA

       EXISTING EXCEL STRUCTURE:

       Row 15+        = options
       Column A       = option number / category
       Column C       = description
       Column J       = sales description
       Column N       = amount

       Rows without Column C are category headers.
       ========================================================= */

    function buildLookbook(sheet) {

      let currentCategory = "";
      let currentSubcategory = "";

      const grouped = {};


      for (
        let i = 14;
        i < sheet.length;
        i++
      ) {

        const row =
          sheet[i] || [];


        const cellA =
          row[0];


        const cellC =
          row[2];


        if (!cellA) {
          continue;
        }


        /* -----------------------------------------
           CATEGORY / SUBCATEGORY ROW
           ----------------------------------------- */

        if (!cellC) {

          const parts =
            String(cellA)
              .split(" > ");


          currentCategory =
            parts[0]?.trim()
            || "General";


          currentSubcategory =
            parts[1]?.trim()
            || "General";


          if (
            !grouped[currentCategory]
          ) {

            grouped[currentCategory] = {};

          }


          if (
            !grouped[currentCategory]
              [currentSubcategory]
          ) {

            grouped[currentCategory]
              [currentSubcategory] = [];

          }


          continue;

        }


        /* -----------------------------------------
           OPTION ROW
           ----------------------------------------- */

        if (!currentCategory) {

          currentCategory =
            "General";

        }


        if (!currentSubcategory) {

          currentSubcategory =
            "General";

        }


        if (
          !grouped[currentCategory]
        ) {

          grouped[currentCategory] = {};

        }


        if (
          !grouped[currentCategory]
            [currentSubcategory]
        ) {

          grouped[currentCategory]
            [currentSubcategory] = [];

        }


        grouped[currentCategory]
          [currentSubcategory]
          .push({

            optionNumber:
              String(cellA).trim(),

            description:
              cellC || "",

            salesDesc:
              row[9] || "",

            amount:
              row[13]

          });

      }


      renderLookbook(grouped);

    }




    /* =========================================================
       OPTION VARIATIONS — EASY EDIT SECTION

       SIMPLE:
       "1234567": {
         "label": "Color",
         "choices": ["White", "Black", "Gray"]
       }

       DOUBLE:
       "1234567": {
         "label": "Collection",
         "secondLabel": "Color",
         "options": {
           "Collection A": ["White", "Gray"],
           "Collection B": ["Blue", "Black"]
         }
       }

       Add future variations in THIS section.
       ========================================================= */

    const OPTION_VARIATIONS = {
  "2001031": {
    "label": "Color",
    "choices": [
      "White",
      "Adobe"
    ]
  },
  "2021067": {
    "label": "Pattern",
    "choices": [
      "Herringbone",
      "Horizontal Stack",
      "Vertical Brick",
      "Vertical Stack"
    ]
  },
  "2005382": {
    "label": "Collection",
    "secondLabel": "Color",
    "options": {
      "Artezen Picket": [
        "Elegant White",
        "Nordic Sand",
        "Ideal Gray",
        "Classic Blue",
        "Dark Blue",
        "Metallic Vibe"
      ],
      "Artezen 2X4 Brick": [
        "Elegant White",
        "Nordic Sand",
        "Ideal Gray",
        "Classic Blue",
        "Dark Blue",
        "Metallic Vibe"

    function createVariationField(labelText, className) {
      const field = document.createElement("div");
      field.className = "variation-field";

      const label = document.createElement("label");
      label.textContent = labelText || "Option";

      const select = document.createElement("select");
      select.className = `variation-select ${className}`;

      field.appendChild(label);
      field.appendChild(select);
      return { field, select };
    }


    function fillVariationSelect(select, choices, placeholder) {
      select.innerHTML = "";

      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = placeholder || "Select";
      select.appendChild(blank);

      (choices || []).forEach(choice => {
        const item = document.createElement("option");
        item.value = choice;
        item.textContent = choice;
        select.appendChild(item);
      });
    }


    function createVariationControls(optionNumber) {
      const config = OPTION_VARIATIONS[String(optionNumber)];
      if (!config) return null;

      const wrap = document.createElement("div");
      wrap.className = "option-variations";

      const first = createVariationField(
        config.label || "Option",
        "variation-primary"
      );
      wrap.appendChild(first.field);

      if (Array.isArray(config.choices)) {
        fillVariationSelect(
          first.select,
          config.choices,
          `Select ${config.label || "Option"}`
        );
        return wrap;
      }

      fillVariationSelect(
        first.select,
        Object.keys(config.options || {}),
        `Select ${config.label || "Option"}`
      );

      const second = createVariationField(
        config.secondLabel || "Color",
        "variation-secondary"
      );
      second.select.disabled = true;

      fillVariationSelect(
        second.select,
        [],
        `Select ${config.secondLabel || "Color"}`
      );

      first.select.addEventListener("change", function() {
        const parent = first.select.value;

        fillVariationSelect(
          second.select,
          parent ? (config.options[parent] || []) : [],
          `Select ${config.secondLabel || "Color"}`
        );

        second.select.disabled = !parent;
      });

      wrap.appendChild(second.field);
      return wrap;
    }


    /* =========================================================
       RENDER LOOKBOOK
       ========================================================= */

    function renderLookbook(grouped) {

      const container =
        document.getElementById(
          "lookbook-container"
        );


      container.innerHTML = "";


      Object.entries(grouped)
        .forEach(
          ([category, subcategories]) => {


            const categoryDetails =
              document.createElement(
                "details"
              );


            categoryDetails.className =
              "category";


            categoryDetails.dataset.search =
              category.toLowerCase();


            const categorySummary =
              document.createElement(
                "summary"
              );


            categorySummary.textContent =
              category;


            categoryDetails.appendChild(
              categorySummary
            );


            const categoryContent =
              document.createElement(
                "div"
              );


            categoryContent.className =
              "category-content";


            Object.entries(
              subcategories
            )
            .forEach(
              ([subcategory, options]) => {


                const subDetails =
                  document.createElement(
                    "details"
                  );


                subDetails.className =
                  "subcategory";


                const subSummary =
                  document.createElement(
                    "summary"
                  );


                subSummary.textContent =
                  subcategory;


                subDetails.appendChild(
                  subSummary
                );


                const optionContainer =
                  document.createElement(
                    "div"
                  );


                optionContainer.className =
                  "option-container";


                options.forEach(
                  option => {

                    optionContainer
                      .appendChild(
                        createOptionCard(
                          option
                        )
                      );

                  }
                );


                subDetails.appendChild(
                  optionContainer
                );


                categoryContent.appendChild(
                  subDetails
                );

              }
            );


            categoryDetails.appendChild(
              categoryContent
            );


            container.appendChild(
              categoryDetails
            );

          }
        );


      updateTotal();

    }




    /* =========================================================
       MULTIPLE IMAGE GALLERY

       File naming:
       OPTION.jpg
       OPTION-2.jpg
       OPTION-3.jpg
       OPTION-4.jpg

       The plain OPTION.jpg is always the main image.
       Extra images must be numbered continuously.
       ========================================================= */

    const MAX_OPTION_IMAGES = 30;


    function optionImageURL(
      optionNumber,
      imageNumber = 1
    ) {

      const base =
        encodeURIComponent(
          String(optionNumber)
        );

      return imageNumber === 1
        ? `/images/${base}.jpg`
        : `/images/${base}-${imageNumber}.jpg`;

    }


    function imageExists(src) {

      return new Promise(
        resolve => {

          const probe =
            new Image();

          probe.onload =
            () => resolve(true);

          probe.onerror =
            () => resolve(false);

          probe.src =
            src;

        }
      );

    }


    async function findOptionGalleryImages(
      optionNumber
    ) {

      const images = [
        optionImageURL(
          optionNumber,
          1
        )
      ];


      for (
        let imageNumber = 2;
        imageNumber <= MAX_OPTION_IMAGES;
        imageNumber++
      ) {

        const src =
          optionImageURL(
            optionNumber,
            imageNumber
          );


        const exists =
          await imageExists(
            src
          );


        if (!exists) {
          break;
        }


        images.push(
          src
        );

      }


      return images;

    }


    function renderCardGalleryImage(
      image,
      imageArea,
      galleryState
    ) {

      image.src =
        galleryState.images[
          galleryState.index
        ];


      const count =
        imageArea.querySelector(
          ".gallery-count"
        );


      if (count) {

        count.textContent =
          `${galleryState.index + 1} / ${galleryState.images.length}`;

      }


      imageArea.classList.toggle(
        "has-gallery",
        galleryState.images.length > 1
      );

    }


    function changeCardGalleryImage(
      image,
      imageArea,
      galleryState,
      direction
    ) {

      if (
        galleryState.images.length <= 1
      ) {
        return;
      }


      galleryState.index =
        (
          galleryState.index +
          direction +
          galleryState.images.length
        ) %
        galleryState.images.length;


      renderCardGalleryImage(
        image,
        imageArea,
        galleryState
      );

    }


    /* =========================================================
       CREATE ONE OPTION CARD
       ========================================================= */

    function createOptionCard(option) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "option";


      card.dataset.option =
        option.optionNumber;


      card.dataset.search =
        [
          option.optionNumber,
          option.description,
          option.salesDesc
        ]
        .join(" ")
        .toLowerCase();



      /* =======================================================
         IMAGE / MULTIPLE IMAGE GALLERY
         ======================================================= */

      const imageArea =
        document.createElement(
          "div"
        );


      imageArea.className =
        "option-image";


      const image =
        new Image();


      image.alt =
        option.optionNumber;


      const galleryState = {
        images: [
          optionImageURL(
            option.optionNumber,
            1
          )
        ],
        index: 0
      };


      const previousButton =
        document.createElement(
          "button"
        );

      previousButton.type =
        "button";

      previousButton.className =
        "gallery-arrow prev";

      previousButton.innerHTML =
        "‹";

      previousButton.setAttribute(
        "aria-label",
        "Previous image"
      );


      const nextButton =
        document.createElement(
          "button"
        );

      nextButton.type =
        "button";

      nextButton.className =
        "gallery-arrow next";

      nextButton.innerHTML =
        "›";

      nextButton.setAttribute(
        "aria-label",
        "Next image"
      );


      const galleryCount =
        document.createElement(
          "div"
        );

      galleryCount.className =
        "gallery-count";


      previousButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          changeCardGalleryImage(
            image,
            imageArea,
            galleryState,
            -1
          );

        }
      );


      nextButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          changeCardGalleryImage(
            image,
            imageArea,
            galleryState,
            1
          );

        }
      );


      image.onload =
        function() {

          if (
            !imageArea.contains(image)
          ) {

            imageArea.innerHTML = "";

            imageArea.appendChild(
              image
            );

            imageArea.appendChild(
              previousButton
            );

            imageArea.appendChild(
              nextButton
            );

            imageArea.appendChild(
              galleryCount
            );

          }

        };


      image.onerror =
        function() {

          imageArea.innerHTML = `

            <div class="image-placeholder">

              No image available<br>

              ${escapeHTML(
                option.optionNumber
              )}

            </div>

          `;

        };


      image.onclick =
        function() {

          openImageModalGallery(
            galleryState.images,
            galleryState.index,
            option.optionNumber
          );

        };


      imageArea.appendChild(
        image
      );

      imageArea.appendChild(
        previousButton
      );

      imageArea.appendChild(
        nextButton
      );

      imageArea.appendChild(
        galleryCount
      );


      renderCardGalleryImage(
        image,
        imageArea,
        galleryState
      );


      findOptionGalleryImages(
        option.optionNumber
      )
      .then(
        images => {

          galleryState.images =
            images;

          if (
            galleryState.index >=
            images.length
          ) {

            galleryState.index = 0;

          }


          renderCardGalleryImage(
            image,
            imageArea,
            galleryState
          );

        }
      );


      card.appendChild(
        imageArea
      );



      /* =======================================================
         CARD BODY
         ======================================================= */

      const body =
        document.createElement(
          "div"
        );


      body.className =
        "option-body";



      const number =
        document.createElement(
          "div"
        );


      number.className =
        "option-number";


      number.textContent =
        option.optionNumber;



      const description =
        document.createElement(
          "div"
        );


      description.className =
        "option-description";


      description.textContent =
        option.description;



      const sales =
        document.createElement(
          "div"
        );


      sales.className =
        "option-sales";


      sales.textContent =
        option.salesDesc || "";



      const spacer =
        document.createElement(
          "div"
        );


      spacer.className =
        "option-spacer";



      const price =
        document.createElement(
          "div"
        );


      price.className =
        "price";
      const includedOption =
        parsePrice(option.amount) === 0 &&
        /\bincluded\b/i.test(
          [
            option.amount,
            option.description,
            option.salesDesc
          ]
            .filter(
              value =>
                value !== null &&
                value !== undefined &&
                value !== ""
            )
            .join(" ")
        );


      price.textContent =
        includedOption
          ? "Included"
          : formatPrice(
              option.amount
            );



      /* =======================================================
         OPTION VARIATIONS
         ======================================================= */

      const variationControls =
        createVariationControls(
          option.optionNumber
        );


      /* =======================================================
         SELECT + QUANTITY
         ======================================================= */

      const controls =
        document.createElement(
          "div"
        );


      controls.className =
        "option-controls";



      const checkLabel =
        document.createElement(
          "label"
        );


      checkLabel.className =
        "check-label";



      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.className =
        "option-checkbox";


      checkbox.dataset.price =
        parsePrice(
          option.amount
        );


      checkbox.dataset.option =
        option.optionNumber;



      const checkText =
        document.createElement(
          "span"
        );


      checkText.textContent =
        "Select Item";


      checkLabel.appendChild(
        checkbox
      );


      checkLabel.appendChild(
        checkText
      );



      const qtyWrap =
        document.createElement(
          "label"
        );


      qtyWrap.className =
        "qty-wrap";


      qtyWrap.textContent =
        "Qty";


      const qty =

          "input"
        );


      qty.type =

      qty.min =
        "1";


      qty.value =
        "1";


      qty.className =
        "option-qty";


      qtyWrap.appendChild(
        qty
      );



      controls.appendChild(
        checkLabel
      );


      controls.appendChild(
        qtyWrap
      );



      /* =======================================================
         COMMENT
         ======================================================= */

      const commentLabel =
        document.createElement(
          "label"
        );


      commentLabel.className =
        "comment-label";


      commentLabel.textContent =
        "Comment";



      const comment =
        document.createElement(
          "textarea"
        );


      comment.className =
        "option-comment";


      comment.placeholder =
        "Optional note...";


      comment.dataset.option =
        option.optionNumber;

      if (variationControls) {
        variationControls
          .querySelectorAll(".variation-select")
          .forEach(select => {
            select.addEventListener(
              "change",

            );

      /* =======================================================

      checkbox.addEventListener(

            "selected",

          );


          updateTotal();

          updateMasterCheckbox();

        }
      );


      qty.addEventListener(
        "input",
        function() {

          if (
            parseInt(qty.value) < 1
          ) {

            qty.value = 1;

          }

          updateTotal();

        }
      );



      /* =======================================================
         ASSEMBLE BODY
         ======================================================= */

      body.appendChild(
        number
      );


      body.appendChild(
        description
      );


      body.appendChild(
        sales
      );


      body.appendChild(
        spacer
      );


      body.appendChild(

      );


      
      if (variationControls) {

          variationControls
        );
      }

        controls
      );


      body.appendChild(
        commentLabel
      );


      body.appendChild(
        comment
      );


      card.appendChild(
        body
      );


      return card;

    }



    /* =========================================================
       LIVE TOTAL
       ========================================================= */

    function updateTotal() {

      let total = 0;


      document
        .querySelectorAll(
          ".option"
        )
        .forEach(
          card => {


            const checkbox =
              card.querySelector(
                ".option-checkbox"
              );


            const qty =
              card.querySelector(
                ".option-qty"
              );


            if (
              !checkbox ||
              !checkbox.checked
            ) {

              return;

            }


            const price =
              parseFloat(
                checkbox.dataset.price
              ) || 0;


            const quantity =
              Math.max(
                1,
                parseInt(
                  qty?.value || 1
                )
              );


            total +=
              price * quantity;

          }
        );


      document
        .getElementById(
          "total-bar"
        )
        .textContent =
          total.toLocaleString(
            undefined,
            {
              style: "currency",
              currency: "USD",
              minimumFractionDigits: 2
            }
          );

    }



    /* =========================================================
       SELECT ALL
       ========================================================= */

    function toggleAllSelections(master) {

      document
        .querySelectorAll(
          ".option"
        )
        .forEach(
          card => {


            if (
              card.style.display ===
              "none"
            ) {

              return;

            }


            const checkbox =
              card.querySelector(
                ".option-checkbox"
              );


            if (!checkbox) {
              return;
            }


            checkbox.checked =
              master.checked;


            card.classList.toggle(
              "selected",
              master.checked
            );

          }
        );


      updateTotal();

    }



    function updateMasterCheckbox() {

      const all =
        Array.from(
          document.querySelectorAll(
            ".option-checkbox"
          )
        );


      const selected =
        all.filter(
          checkbox =>
            checkbox.checked
        );


      const master =
        document.getElementById(
          "toggle-all"
        );


      master.checked =
        all.length > 0 &&
        selected.length === all.length;


      master.indeterminate =
        selected.length > 0 &&
        selected.length < all.length;

    }



    /* =========================================================

       ========================================================= */

    function toggleAllSections() {

      const details =
        Array.from(
          document.querySelectorAll(
            "#lookbook-container details"
          )
        );


      const anyClosed =
        details.some(
          item => !item.open
        );


      details.forEach(
        item => {

          item.open =
            anyClosed;

        }
      );

    }



    /* =========================================================
       SEARCH
       ========================================================= */

    function filterOptions() {

      const query =
        document
          .getElementById(
            "search-input"
          )
          .value
          .trim()
          .toLowerCase();


      let visibleCount = 0;


      document
        .querySelectorAll(
          ".category"
        )
        .forEach(
          category => {


            let categoryHasMatch =
              false;


            category
              .querySelectorAll(
                ".subcategory"
              )
              .forEach(
                subcategory => {


                  let subHasMatch =
                    false;


                  subcategory
                    .querySelectorAll(
                      ".option"
                    )
                    .forEach(
                      card => {


                        const match =
                          !query ||
                          card.dataset.search
                            .includes(query);


                        card.style.display =
                          match
                            ? ""
                            : "none";


                        if (match) {

                          subHasMatch =
                            true;

                          categoryHasMatch =
                            true;

                          visibleCount++;

                        }

                      }
                    );


                  subcategory.style.display =
                    subHasMatch
                      ? ""
                      : "none";


                  if (
                    query &&
                    subHasMatch
                  ) {

                    subcategory.open =
                      true;

                  }

                }
              );


            category.style.display =
              categoryHasMatch
                ? ""
                : "none";


            if (
              query &&
              categoryHasMatch
            ) {

              category.open =
                true;

            }

          }
        );


      document
        .getElementById(
          "no-results"
        )
        .style.display =
          visibleCount === 0
            ? "block"
            : "none";

    }



    function clearSearch() {

      document
        .getElementById(
          "search-input"
        )
        .value = "";


      filterOptions();

    }

      modalCard.classList.toggle(
        "has-gallery",
        hasGallery
      );


      if (count) {

        count.textContent =
          `${modalGalleryIndex + 1} / ${modalGalleryImages.length}`;

      }

    }


    function openImageModalGallery(
      images,
      startIndex = 0,
      alt = ""
    ) {

      modalGalleryImages =
        Array.isArray(images)
          ? images.filter(Boolean)
          : [];


      if (!modalGalleryImages.length) {
        return;
      }


      modalGalleryIndex =
        Math.max(
          0,
          Math.min(
            startIndex,
            modalGalleryImages.length - 1
          )
        );


      modalGalleryAlt =
        alt || "";


      updateModalGallery();


      document
        .getElementById(
          "image-modal"
        )
        .classList.add(
          "open"
        );

    }


    function openImageModal(
      src,
      alt
    ) {

      openImageModalGallery(
        [src],
        0,
        alt
      );

    }


    function changeModalGalleryImage(
      direction
    ) {

      if (
        modalGalleryImages.length <= 1
      ) {
        return;
      }


      modalGalleryIndex =
        (
          modalGalleryIndex +
          direction +
          modalGalleryImages.length
        ) %
        modalGalleryImages.length;


      updateModalGallery();

    }


    function closeImageModal() {

      document
        .getElementById(
          "image-modal"
        )
        .classList.remove(
          "open"
        );

    }


    function modalBackgroundClose(
      event
    ) {

      if (
        event.target.id ===
        "image-modal"
      ) {

        closeImageModal();

      }

    }



    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeImageModal();

        }


        const modalOpen =
          document
            .getElementById(
              "image-modal"
            )
            ?.classList
            .contains(
              "open"
            );


        if (
          modalOpen &&
          event.key ===
          "ArrowLeft"
        ) {

          changeModalGalleryImage(
            -1
          );

        }


        if (
          modalOpen &&
          event.key ===
          "ArrowRight"
        ) {

          changeModalGalleryImage(
            1
          );

        }

      }
    );



    /* =========================================================
       GET CURRENT SELECTIONS

       This becomes the payload saved to Netlify Blobs.
       ========================================================= */

    function getCurrentSelections() {

      const selections = [];


      document
        .querySelectorAll(
          ".option"
        )
        .forEach(
          card => {


            const checkbox =
              card.querySelector(
                ".option-checkbox"
              );


            if (
              !checkbox ||
              !checkbox.checked
            ) {

              return;

            }


            const qty =
              Math.max(
                1,
                parseInt(
                  card
                    .querySelector(
                      ".option-qty"
                    )
                    ?.value || 1
                )
              );


            const comment =
              card
                .querySelector(
                  ".option-comment"
                )
                ?.value
                ?.trim()
                || "";
            const variation1 =
              card
                .querySelector(".variation-primary")
                ?.value
                ?.trim()
                || "";

            const variation2 =
              card
                .querySelector(".variation-secondary")
                ?.value
                ?.trim()
                || "";


            selections.push({

              option:
                card.dataset.option,

              qty,

              comment,

              variation1,

              variation2

            });

          }
        );


      return selections;

    }



    /* =========================================================
       CREATE CUSTOMER LOOKBOOK

       IMPORTANT:
       The frontend is ready.

       Our NEXT STEP is creating:
       /.netlify/functions/create-lookbook

       That function will store the workbook and metadata in
       Netlify Blobs and return the permanent customer URL.
       ========================================================= */

    async function createCustomerLookbook() {

      const name =
        document
          .getElementById(
            "lookbook-name"
          )
          .value
          .trim();


      if (!name) {

        alert(
          "Please enter a Customer / Lookbook Name."
        );

        return;

      }


      const workbook =
        localStorage.getItem(
          "workbook"
        );


      if (!workbook) {

        alert(
          "The workbook is no longer loaded. Please return to the Dashboard and upload it again."
        );

        return;

      }


      const selections =
        getCurrentSelections();


      /*
        The create-lookbook backend is our next file.

        When it exists, this will create the record in
        Netlify Blobs and return a private customer ID.
      */


      try {

        const response =
          await fetch(
            "/.netlify/functions/create-lookbook",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  name,

                  workbook,

                  selections

                })

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            result.message ||
            "Unable to create Lookbook."
          );

        }


        showToast(
          "Customer Lookbook created."
        );


        if (
          result.url
        ) {

          await copyText(
            result.url
          );


          window.open(
            result.url,
            "_blank"
          );

        }


      } catch (error) {

        console.error(error);


        /*
          While we are still building the backend,
          give Studio a clear message instead of
          a confusing browser error.
        */

        alert(

          "The Lookbook preview is working. " +

          "The customer-saving function is the next part we're adding."

        );

      }

    }



    /* =========================================================
       PRINT SELECTED OPTIONS

        window.open(

      if (!windowRef) {

      let html = `

                5px solid #f3c63f;

              font-size:16px;
            }

              font-weight:700;

            }

            }

              color:#666;

            .comment {

        </head>

        <body>


          <div class="header">

            <div>

              <img
                class="logo"
                src="/kb logo.png"
              >

            </div>


            <div style="

            ">

              <h1>
                Selected Options
              </h1>

              <div class="house">

                ${
                  document
                    .getElementById(
                      "house-info"
                    )
                    .innerHTML
                }

              </div>

            </div>

          </div>

      `;



      document
        .querySelectorAll(
          "details.category"
        )
        .forEach(
          category => {


            const selected =
              Array.from(
                category
                  .querySelectorAll(
                    ".option.selected"
                  )
              );


            if (
              selected.length === 0
            ) {

              return;

            }


            html += `

              <h2>

                ${
                  escapeHTML(
                    category
                      .querySelector(
                        ":scope > summary"
                      )
                      ?.textContent
                    || ""
                  )
                }

              </h2>

            `;


            selected.forEach(
              card => {


                const checkbox =
                  card.querySelector(
                    ".option-checkbox"
                  );


                const price =
                  parseFloat(
                    checkbox
                      ?.dataset
                      ?.price
                    || 0
                  );


                const qty =
                  Math.max(
                    1,
                    parseInt(
                      card
                        .querySelector(
                          ".option-qty"
                        )
                        ?.value || 1
                    )
                  );


                const lineTotal =
                  price * qty;


                total +=
                  lineTotal;


                const image =
                  card.querySelector(
                    ".option-image img"
                  );


                const optionNumber =
                  card.querySelector(
                    ".option-number"

                  ?.textContent || "";

                html += `

                  <div class="option">


                    <div>

                      ${

                              escapeAttribute(
                                image.src

                          >

                    <div>

                          )

                    <div class="amount">

                      <div>
                        Qty: ${qty}
                      </div>

                      <strong>

                        ${

                              currency:"USD"
                            }

          }
        );


      html += `

        <div class="total">

          Total:

          ${
            total.toLocaleString(
              undefined,
              {
                style:"currency",
                currency:"USD"
              }
            )
          }

        </div>


        <div style="
          margin-top:25px;
          text-align:right;
        ">

          <button
            class="print-button"
            onclick="window.print()"

            style="
              border:0;
              background:#f3c63f;
              color:#252525;
              font-weight:700;
              padding:10px 15px;
              border-radius:7px;
              cursor:pointer;
            "
          >
            Print / Save PDF
          </button>

        </div>


        </body>

        </html>

      `;


      windowRef.document.write(
        html
      );


      windowRef.document.close();

    }



    /* =========================================================
       SMALL HELPERS
       ========================================================= */

    function escapeHTML(value) {

      return String(
        value ?? ""
      )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

    }



    function escapeAttribute(value) {

      return escapeHTML(
        value
      );

    }



    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        window.__toastTimer
      );


      window.__toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2500
        );

    }



    async function copyText(text) {

      try {

        await navigator
          .clipboard
          .writeText(text);

        showToast(
          "Link copied to clipboard."
        );

      } catch {

        /* Clipboard access may be blocked.
           This does not stop Lookbook creation. */

      }

    }



    /* =========================================================
       START LOOKBOOK
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        enableCustomerAutosave();

        loadCustomerLookbook();

      }
    );

  </script>
