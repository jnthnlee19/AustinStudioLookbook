<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Studio Scheduling Admin | KB Home Austin
  </title>


  <style>

    :root {

      --navy: #1f2f46;
      --navy-hover: #162337;

      --yellow: #f3c63f;
      --yellow-soft: #fff8dd;

      --cream: #f7f3eb;
      --card: #ffffff;

      --line: #dfe3e7;
      --muted: #707780;

      --green: #2d7a54;
      --green-soft: #edf8f2;

      --red: #a33b34;
      --red-soft: #fff1f0;

      --blue: #356b9a;
      --blue-soft: #edf5fb;

      --purple: #7255a3;
      --purple-soft: #f2edfa;

      --gray-soft: #f4f5f6;

      --shadow:
        0 12px 34px
        rgba(31,47,70,.07);

    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background:
        var(--cream);

      color:
        #292e33;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    }


    button,
    input,
    select {

      font: inherit;

    }


    button {
      cursor: pointer;
    }


    .shell {

      width:
        min(
          1500px,
          calc(100% - 30px)
        );

      margin:
        0 auto;

      padding:
        26px 0 50px;

    }



    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      background:
        var(--card);

      border:
        1px solid
        var(--line);

      border-top:
        5px solid
        var(--yellow);

      border-radius:
        16px;

      box-shadow:
        var(--shadow);

      padding:
        22px 24px;

      margin-bottom:
        17px;

    }


    .eyebrow {

      color:
        #8b9096;

      font-size:
        .7rem;

      font-weight:
        800;

      letter-spacing:
        .12em;

      text-transform:
        uppercase;

    }


    .header-top {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        20px;

    }


    .header h1 {

      margin:
        4px 0 6px;

      color:
        var(--navy);

      font-size:
        1.7rem;

    }


    .header p {

      margin: 0;

      color:
        var(--muted);

      font-size:
        .86rem;

      line-height:
        1.5;

    }


    .booking-links {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

      margin-top:
        15px;

    }


    .booking-links a {

      display:
        inline-flex;

      align-items:
        center;

      padding:
        8px 11px;

      border:
        1px solid
        #d8dde2;

      border-radius:
        8px;

      background:
        #fff;

      color:
        var(--navy);

      text-decoration:
        none;

      font-size:
        .75rem;

      font-weight:
        750;

    }


    .booking-links a:hover {

      background:
        var(--yellow-soft);

      border-color:
        #ead98e;

    }



    /* =====================================================
       CARDS
       ===================================================== */

    .card {

      background:
        var(--card);

      border:
        1px solid
        var(--line);

      border-radius:
        15px;

      box-shadow:
        var(--shadow);

      overflow:
        hidden;

    }


    .card-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        14px;

      padding:
        18px 20px 15px;

      border-bottom:
        1px solid
        var(--line);

    }


    .card-header h2 {

      margin: 0;

      color:
        var(--navy);

      font-size:
        1.08rem;

    }


    .card-header p {

      margin:
        4px 0 0;

      color:
        var(--muted);

      font-size:
        .76rem;

    }


    .card-body {
      padding: 18px;
    }



    /* =====================================================
       BUTTONS
       ===================================================== */

    .btn {

      border:
        1px solid
        #d7dbe0;

      border-radius:
        8px;

      padding:
        8px 11px;

      background:
        #fff;

      color:
        var(--navy);

      font-size:
        .76rem;

      font-weight:
        750;

    }


    .btn:hover {
      background: #f7f8f9;
    }


    .btn-yellow {

      background:
        var(--yellow);

      border-color:
        var(--yellow);

      color:
        #262626;

    }


    .btn-confirm {

      color:
        var(--green);

      border-color:
        #cfe4d8;

      background:
        #f7fcf9;

    }


    .btn-decline {

      color:
        var(--red);

      border-color:
        #e3c7c4;

      background:
        #fffafa;

    }



    /* =====================================================
       CALENDAR
       ===================================================== */

    .calendar-card {

      margin-bottom:
        18px;

    }


    .calendar-controls {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      flex-wrap:
        wrap;

    }


    .week-label {

      color:
        var(--navy);

      font-size:
        .86rem;

      font-weight:
        800;

      margin-right:
        5px;

    }


    .calendar-body {

      padding:
        14px;

      overflow-x:
        auto;

    }


    .calendar-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          5,
          minmax(210px, 1fr)
        );

      gap:
        10px;

      min-width:
        1080px;

    }


    .calendar-day {

      border:
        1px solid
        #e2e5e8;

      border-radius:
        11px;

      background:
        #fbfbfb;

      overflow:
        hidden;

      min-height:
        340px;

    }


    .calendar-day.today {

      border:
        2px solid
        var(--yellow);

    }


    .day-header {

      padding:
        11px 12px;

      background:
        #fff;

      border-bottom:
        1px solid
        #e6e9ec;

    }


    .day-name {

      color:
        var(--navy);

      font-size:
        .72rem;

      font-weight:
        850;

      text-transform:
        uppercase;

      letter-spacing:
        .055em;

    }


    .day-date {

      margin-top:
        2px;

      color:
        #454c53;

      font-size:
        .82rem;

      font-weight:
        700;

    }


    .day-content {

      padding:
        9px;

      display:
        grid;

      gap:
        7px;

    }



    /* =====================================================
       CALENDAR ITEMS
       ===================================================== */

    .calendar-item {

      padding:
        8px 9px;

      border-radius:
        8px;

      border:
        1px solid transparent;

      font-size:
        .7rem;

      line-height:
        1.35;

    }


    .calendar-item-time {

      font-weight:
        850;

      margin-bottom:
        2px;

    }


    .calendar-item-title {

      font-weight:
        750;

    }


    .calendar-item-note {

      margin-top:
        2px;

      opacity:
        .8;

    }


    .calendar-item.available {

      background:
        var(--green-soft);

      color:
        var(--green);

      border-color:
        #cfe4d8;

    }


    .calendar-item.requested {

      background:
        var(--yellow-soft);

      color:
        #79600a;

      border-color:
        #ead98e;

    }


    .calendar-item.confirmed {

      background:
        var(--blue-soft);

      color:
        var(--blue);

      border-color:
        #cbddeb;

    }


    .calendar-item.virtual {

      background:
        var(--purple-soft);

      color:
        var(--purple);

      border-color:
        #dcd0ef;

    }


    .calendar-item.off {

      background:
        var(--red-soft);

      color:
        var(--red);

      border-color:
        #edcfcb;

    }


    .calendar-item.meeting {

      background:
        #eceff2;

      color:
        #4f5963;

      border-color:
        #d9dde1;

    }


    .calendar-empty {

      padding:
        18px 10px;

      text-align:
        center;

      color:
        var(--muted);

      font-size:
        .72rem;

    }



    /* =====================================================
       LOWER LAYOUT
       ===================================================== */

    .lower-grid {

      display:
        grid;

      grid-template-columns:
        minmax(0, 1.3fr)
        minmax(340px, .7fr);

      gap:
        18px;

      align-items:
        start;

    }


    .right-column {

      display:
        grid;

      gap:
        18px;

    }



    /* =====================================================
       REQUESTS
       ===================================================== */

    .request-list {

      display:
        grid;

      gap:
        10px;

    }


    .request-card {

      border:
        1px solid
        #e3e6e9;

      border-radius:
        10px;

      padding:
        13px;

      background:
        #fff;

    }


    .request-top {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:
        10px;

    }


    .request-name {

      color:
        var(--navy);

      font-weight:
        800;

      font-size:
        .9rem;

    }


    .request-meta {

      color:
        var(--muted);

      font-size:
        .74rem;

      line-height:
        1.45;

      margin-top:
        3px;

    }


    .request-details {

      border-top:
        1px solid
        #edf0f2;

      margin-top:
        9px;

      padding-top:
        9px;

      color:
        #4b5157;

      font-size:
        .75rem;

      line-height:
        1.5;

    }


    .request-actions {

      display:
        flex;

      gap:
        6px;

      flex-wrap:
        wrap;

      margin-top:
        10px;

    }



    /* =====================================================
       BADGES
       ===================================================== */

    .status-badge {

      display:
        inline-flex;

      padding:
        5px 8px;

      border-radius:
        999px;

      font-size:
        .64rem;

      font-weight:
        850;

      letter-spacing:
        .035em;

      text-transform:
        uppercase;

      white-space:
        nowrap;

    }


    .status-badge.requested {

      background:
        var(--yellow-soft);

      color:
        #79600a;

    }


    .status-badge.confirmed {

      background:
        var(--blue-soft);

      color:
        var(--blue);

    }


    .status-badge.declined {

      background:
        var(--red-soft);

      color:
        var(--red);

    }



    /* =====================================================
       AVAILABILITY PANEL
       ===================================================== */

    .availability-date {

      width:
        100%;

      padding:
        10px;

      border:
        1px solid
        #cfd4d9;

      border-radius:
        8px;

      margin-bottom:
        12px;

      outline:
        none;

    }


    .availability-group {

      margin-bottom:
        15px;

    }


    .availability-title {

      color:
        var(--navy);

      font-size:
        .76rem;

      font-weight:
        850;

      text-transform:
        uppercase;

      letter-spacing:
        .045em;

      margin-bottom:
        6px;

    }


    .availability-slot {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      padding:
        7px 9px;

      margin-bottom:
        5px;

      border:
        1px solid
        #dce8e1;

      border-radius:
        7px;

      background:
        #f7fcf9;

      color:
        var(--green);

      font-size:
        .73rem;

    }


    .availability-slot strong {
      color: var(--navy);
    }


    .availability-none {

      color:
        var(--muted);

      font-size:
        .74rem;

      padding:
        7px 0;

    }



    /* =====================================================
       RULE FORM
       ===================================================== */

    .form-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap:
        10px;

    }


    .field.full {
      grid-column: 1 / -1;
    }


    label {

      display:
        block;

      margin-bottom:
        5px;

      color:
        var(--navy);

      font-size:
        .69rem;

      font-weight:
        750;

    }


    input,
    select {

      width:
        100%;

      padding:
        9px 10px;

      border:
        1px solid
        #cfd4d9;

      border-radius:
        8px;

      background:
        #fff;

      color:
        #30353a;

      outline:
        none;

    }


    input:focus,
    select:focus {

      border-color:
        #b9a040;

      box-shadow:
        0 0 0 3px
        rgba(243,198,63,.15);

    }


    .form-note {

      margin-top:
        9px;

      color:
        var(--muted);

      font-size:
        .71rem;

      line-height:
        1.45;

    }



    /* =====================================================
       RULE LIST
       ===================================================== */

    .rule-list {

      display:
        grid;

      gap:
        8px;

    }


    .rule-card {

      border:
        1px solid
        #e3e6e9;

      border-radius:
        9px;

      padding:
        11px;

    }


    .rule-name {

      color:
        var(--navy);

      font-size:
        .8rem;

      font-weight:
        800;

    }


    .rule-meta {

      color:
        var(--muted);

      font-size:
        .71rem;

      line-height:
        1.4;

      margin-top:
        3px;

    }


    .rule-actions {
      margin-top: 8px;
    }


    .empty {

      padding:
        25px 12px;

      text-align:
        center;

      color:
        var(--muted);

      font-size:
        .78rem;

    }



    /* =====================================================
       LEGEND
       ===================================================== */

    .legend {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

      padding:
        0 14px 14px;

    }


    .legend-item {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        5px;

      color:
        var(--muted);

      font-size:
        .67rem;

    }


    .legend-dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        3px;

    }


    .legend-dot.available {
      background: #8dc6a6;
    }

    .legend-dot.requested {
      background: #e6c352;
    }

    .legend-dot.confirmed {
      background: #79a9ce;
    }

    .legend-dot.virtual {
      background: #a992cf;
    }

    .legend-dot.off {
      background: #d99189;
    }

    .legend-dot.meeting {
      background: #aab0b6;
    }



    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (
      max-width: 950px
    ) {

      .lower-grid {

        grid-template-columns:
          1fr;

      }

    }


    @media (
      max-width: 600px
    ) {

      .header-top {

        flex-direction:
          column;

      }


      .form-grid {

        grid-template-columns:
          1fr;

      }


      .field.full {

        grid-column:
          auto;

      }


      .request-top {

        flex-direction:
          column;

      }

    }

  </style>

</head>


<body>

  <main class="shell">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <section class="header">

      <div class="header-top">

        <div>

          <div class="eyebrow">
            KB Home • Austin Design Studio
          </div>

          <h1>
